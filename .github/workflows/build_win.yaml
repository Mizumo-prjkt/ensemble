name: Build (Windows)

on:
  workflow_dispatch:
    inputs:
      GITHUB_VERSIONING:
        description: "Version for Github Releases"
        required: true
        type: string
        default: "1.1.0"
      BUILD_WITH_DEBUG:
        description: "Build with Debug symbols"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: "Building the App (Windows)"
    runs-on: windows-2022
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtwebchannel qtpositioning'

      - name: Build
        shell: pwsh
        run: |
          if ("${{ inputs.BUILD_WITH_DEBUG }}" -eq "true") {
            .\build.ps1 debug
          } else {
            .\build.ps1 release
          }

      - name: Bundle Qt DLLs with windeployqt
        shell: pwsh
        run: |
          $ExePath = if (Test-Path "build\Release\ensemble.exe") { "build\Release\ensemble.exe" } elseif (Test-Path "build\Debug\ensemble.exe") { "build\Debug\ensemble.exe" } else { "build\ensemble.exe" }
          Write-Host "Found executable at: $ExePath"
          $OutDir = "build\dist_win"
          New-Item -ItemType Directory -Force -Path $OutDir
          Copy-Item $ExePath -Destination "$OutDir\ensemble.exe"
          
          # Deploy Qt dependencies and Chromium WebEngine assets into dist folder
          windeployqt --compiler-runtime "$OutDir\ensemble.exe"
          
          # Package into standalone zip release archive
          Compress-Archive -Path "$OutDir\*" -DestinationPath "build\ensemble-windows-x64.zip" -Force

      - name: Upload to Github Releases
        uses: softprops/action-gh-release@v3
        with: 
          files: |
            build/ensemble-windows-x64.zip
          name: Ensemble Release ${{ github.event.inputs.GITHUB_VERSIONING }}
          tag_name: ${{ github.event.inputs.GITHUB_VERSIONING }}  
          body: |
            Ensemble Release<br>
            Version ${{github.event.inputs.GITHUB_VERSIONING}}

            Notes:
            This release is for Windows (x64). Extract the zip archive and run `ensemble.exe`.
            
            For more information, visit: https://github.com/Mizumo-prjkt/ensemble
        env:
          GITHUB_TOKEN: ${{secrets.KEYS}}