name: Build (Windows)

on:
  workflow_dispatch:
    inputs:
      GITHUB_VERSIONING:
        description: "Version for Github Releases"
        required: true
        type: string
        default: "1.1.0"
      BUILD_WITH_DEBUG:
        description: "Build with Debug symbols"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: "Building the App (Windows)"
    runs-on: windows-2022
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019'

      - name: Build
        shell: pwsh
        run: |
          if ("${{ inputs.BUILD_WITH_DEBUG }}" -eq "true") {
            .\build.ps1 debug
          } else {
            .\build.ps1 release
          }

      - name: Upload to Github Releases
        uses: softprops/action-gh-release@v3
        with: 
          files: |
            build/Release/ensemble.exe
            build/Debug/ensemble.exe
            build/ensemble.exe
          name: Ensemble Release ${{ github.event.inputs.GITHUB_VERSIONING }}
          tag_name: ${{ github.event.inputs.GITHUB_VERSIONING }}  
          body: |
            Ensemble Release<br>
            Version ${{github.event.inputs.GITHUB_VERSIONING}}

            Notes:
            This release is for Windows only, find the Linux variant somewhere in this repo or build it yourself.
            
            For more information, visit: https://github.com/Mizumo-prjkt/ensemble
        env:
          GITHUB_TOKEN: ${{secrets.KEYS}}