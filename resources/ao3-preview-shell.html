<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AO3 Preview</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1rem;
    line-height: 1.6;
    color: #e2e2e5;
    background-color: #1a1a24;
  }
  p {
    margin-top: 0;
    margin-bottom: 0.8em;
  }
  #preview-banner {
    background-color: #15161c;
    color: #aeb3c6;
    border-bottom: 1px solid #282a36;
    padding: 8px 16px;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 0.82rem;
    line-height: 1.45;
  }
  #preview-banner strong {
    color: #e2e6f6;
  }
  #workskin {
    box-sizing: border-box;
    padding: 1.5rem 2rem;
    background-color: #1a1a24;
    color: #e2e2e5;
    min-height: 100vh;
  }
  #workskin *, #workskin *::before, #workskin *::after {
    box-sizing: border-box;
  }
  #workskin span[class*="box"], #workskin span[class*="-box"], #workskin span[class*="card"] {
    display: inline-block;
    width: 100%;
  }
  #chapter-title {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 1.5rem;
    font-weight: bold;
    color: #ffb86c;
    margin-top: 0;
    margin-bottom: 1.2rem;
    border-bottom: 1px solid #383a4c;
    padding-bottom: 0.5rem;
  }
  #chapter-content blockquote {
    margin: 1em 2em;
    font-style: italic;
  }
  #chapter-content pre {
    white-space: pre-wrap;
    font-family: monospace;
    background: #21222c;
    padding: 0.75em;
    border-radius: 4px;
  }
</style>
<style id="workskin"></style>
</head>
<body>
<div id="preview-banner">
  ℹ️ <strong>Preview Note:</strong> Rendered with active AO3 Work Skin.
</div>
<div id="workskin">
<h2 id="chapter-title"></h2>
<div id="chapter-content"></div>
</div>
</body>
</html>
