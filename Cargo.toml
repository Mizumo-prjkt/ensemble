[workspace]
resolver = "2"
members = [
    "crates/ensemble-core",
    "crates/ensemble-html",
    "crates/ensemble-theme",
    "crates/ensemble-plugin-engine",
    "crates/ensemble-net",
    "crates/ensemble-mcp",
    "crates/ensemble-app",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["Ensemble Contributors"]
repository = "https://github.com/ensemble-ao3/ao3-typewriter"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zstd = "0.13"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
subtle = "2.6"
similar = "2.6"
regex = "1.11"
dirs = "5.0"
sysinfo = "0.32"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.10"
thiserror = "2.0"
log = "0.4"
once_cell = "1.20"
tempfile = "3.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
scraper = "0.21"
html5ever = "0.29"
markup5ever_rcdom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "blocking"] }
tokio = { version = "1.41", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
interprocess = "2.2"
libadwaita = { version = "0.7", features = ["v1_4"] }
gtk4 = { version = "0.9", features = ["v4_12"] }
webkit6 = "0.4"
rfd = "0.15"
arboard = "3.4"

ensemble-core = { path = "crates/ensemble-core" }
ensemble-html = { path = "crates/ensemble-html" }
ensemble-theme = { path = "crates/ensemble-theme" }
ensemble-plugin-engine = { path = "crates/ensemble-plugin-engine" }
ensemble-net = { path = "crates/ensemble-net" }
ensemble-mcp = { path = "crates/ensemble-mcp" }
